name = "quantum-pulse-access-worker"
main = "src/worker.ts"
compatibility_date = "2024-09-01"

# Public routes, bound in the Cloudflare dashboard to the pulse subdomain
# used across the repo (LESSON_PAGES_BASE_URL / LESSON_AUDIO_BASE_URL).
# routes = [{ pattern = "pulse.quantumreadyea.org/*", zone_name = "quantumreadyea.org" }]

[[kv_namespaces]]
binding = "QUANTUM_AUTH_KV"
id = "REPLACE_WITH_REAL_KV_NAMESPACE_ID"

[[r2_buckets]]
binding = "LESSON_AUDIO_BUCKET"
bucket_name = "quantum-ready-pulse-audio"

[vars]
# Base URL of services/pulse-api, for the /pulse/verify-access call.
PULSE_API_BASE_URL = "https://api.quantumreadyea.org"

# Set as a secret in production: `wrangler secret put PULSE_API_SERVICE_TOKEN`
# PULSE_API_SERVICE_TOKEN = ""
