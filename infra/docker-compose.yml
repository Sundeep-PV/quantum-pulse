version: "3.9"

# Local dev Postgres only -- staging/prod use Quantinnel's existing managed
# Postgres instance (see docs/architecture.md), this is not meant to be
# deployed anywhere.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
      POSTGRES_DB: quantum_pulse
    ports:
      - "5432:5432"
    volumes:
      - pulse_pgdata:/var/lib/postgresql/data

volumes:
  pulse_pgdata:
